name = "permit-sniper"
main = "src/index.ts"
compatibility_date = "2024-12-01"

# MOTHBALLED 2026-09-22 until spring 2027. The cron trigger was removed from the deployed
# Worker and this config was changed to match, because otherwise the next
# `wrangler deploy` would put the every-minute schedule straight back.
#
# This is a seasonal tool — river permit cancellations only matter in the float season —
# and it is deliberately dormant, not abandoned. Nothing was deleted.
#
# Why: measured over 24 h, this Worker ran 1,418 times and 525 of those were KILLED with
# `exceededResources` at exactly the 10 ms free-tier CPU cap; the runs that survived
# averaged ~21 ms. So it was both generating Cloudflare's CPU-limit emails for the whole
# account AND silently failing roughly one availability check in three. Each run fetches
# three rivers, JSON-parses the availability payload and diffs division x date against KV
# — too much work for one free-tier invocation.
#
# A Worker with no triggers costs nothing and stays deployed, so the `fetch` handler still
# answers /check by hand. To bring it back, fix the cost first — something like:
#     [triggers]
#     crons = ["*/5 * * * *"]      # 288 runs/day instead of 1,440
# and split RIVERS across runs so each invocation parses ONE payload, not three.
#
# [triggers]
# crons = ["* * * * *"]

# KV namespace for persisting availability state between runs
[[kv_namespaces]]
binding = "STATE"
id = "790fd0e3669c4cc2ba9dea6f595f1a05"

[vars]
RIVERS = "middle_fork,main_salmon,selway"
EMAIL_TO = "ianlrvd@gmail.com,itogeospatial@gmail.com,Frenchthomas6@gmail.com,Alexowensbaird@gmail.com"
# Set secrets via: wrangler secret put TWILIO_ACCOUNT_SID, etc.
# Required for SMS: TWILIO_ACCOUNT_SID, TWILIO_AUTH_TOKEN, TWILIO_FROM, TWILIO_TO
# Required for email: RESEND_API_KEY, EMAIL_FROM
